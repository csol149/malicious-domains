name: Report a false positive
description: Request removal of a domain from the list
title: "[Remove] "
labels: ["false-positive"]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: example.com
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should it be removed?
      description: Describe the legitimate use and what breaks when it is blocked.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting information
      description: Links to ownership, documentation, or clean scan results.
